<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Group - DWCRA Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Open Sans', sans-serif; background-color: #f8f9fa; }
        .navbar { background: linear-gradient(135deg, #3F51B5 0%, #5C6BC0 100%); }
        .card { border: none; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/admin_dashboard">
                <i class="fas fa-tachometer-alt me-2"></i>DWCRA Admin
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/admin_dashboard">Dashboard</a>
                <a class="nav-link" href="/admin/users">Users</a>
                <a class="nav-link active" href="/admin/groups">Groups</a>
                <a class="nav-link" href="/admin/loans">Loans</a>
                <a class="nav-link" href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0"><i class="fas fa-layer-group me-2"></i>Create New Group</h4>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label">Group Leader *</label>
                                <select class="form-select" name="leader_id" required>
                                    <option value="">Select Leader</option>
                                    {% for leader in leaders %}
                                    <option value="{{ leader.user_id }}">{{ leader.name }} ({{ leader.unique_id }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Group Members (Select up to 6 members)</label>
                                <div class="row">
                                    {% for i in range(6) %}
                                    <div class="col-md-6 mb-2">
                                        <select class="form-select" name="member_ids">
                                            <option value="">Select Member {{ i + 1 }}</option>
                                            {% for member in members %}
                                            <option value="{{ member.user_id }}">{{ member.name }} ({{ member.unique_id }})</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                    {% endfor %}
                                </div>
                            </div>
                            
                            <div class="d-flex justify-content-between">
                                <a href="/admin/groups" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left me-1"></i>Back to Groups
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-1"></i>Create Group
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
