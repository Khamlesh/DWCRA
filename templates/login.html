{% extends "layout.html" %}

{% block title %}{{ translations.portal_title }} - Login{% endblock %}

{% block head %}
    <style>
        /* Specific styles for the Login page card and form */
        .login-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            max-width: 450px;
            margin: 3rem auto;
        }

        .login-card .card-header {
            background: linear-gradient(135deg, #3F51B5 0%, #2196F3 100%);
            color: #fff;
            padding: 2rem 1.5rem;
            border-bottom: none;
            text-align: center;
        }

        .login-card .card-header img {
            height: 80px;
            width: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #FFC107;
            box-shadow: 0 0 15px rgba(255, 193, 7, 0.7);
            margin-bottom: 1rem;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .login-card .card-header h2 {
            font-size: 2.2rem;
            font-weight: 700;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
            margin-top: 1rem;
        }

        .login-card .card-body {
            padding: 2rem;
            background-color: #fff;
        }

        .form-label {
            font-weight: 600;
            color: #555;
            margin-bottom: 0.5rem;
        }

        .form-control {
            border-radius: 8px;
            padding: 0.75rem 1rem;
            border: 1px solid #ced4da;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-control:focus {
            border-color: #3F51B5;
            box-shadow: 0 0 0 0.25rem rgba(63, 81, 181, 0.25);
        }

        .btn-primary {
            background-color: #3F51B5 !important;
            border-color: #3F51B5 !important;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(63, 81, 181, 0.3);
        }

        .btn-primary:hover {
            background-color: #303F9F !important;
            border-color: #303F9F !important;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(63, 81, 181, 0.4);
        }

        .text-center a {
            color: #3F51B5;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .text-center a:hover {
            color: #2196F3;
            text-decoration: underline;
        }
    </style>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card login-card">
            <div class="card-header text-center">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTNA6XUOGgfbKWj6ejiYD8fhXc_cQAPt1hwlg&s"
                     alt="DWCRA Logo" class="mb-2">
                <h2 class="fw-bold mb-0">{{ translations.login_to_dwcra }}</h2>
            </div>
            <div class="card-body">
                <form method="POST" action="/login">
                    <div class="mb-3">
                        <label for="unique_id" class="form-label">{{ translations.unique_id }} or Email</label>
                        <input type="text" class="form-control" id="unique_id" name="unique_id" placeholder="Enter your Unique ID or Email" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">{{ translations.password }}</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3">{{ translations.secure_login }}</button>
                </form>

                <div class="mt-3 text-center">
                    <a href="{{ url_for('register') }}" class="d-block mb-2">{{ translations.new_user_register }}</a>
                    <a href="{{ url_for('reset_password_request') }}">{{ translations.forgot_password }}</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
