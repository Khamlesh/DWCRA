<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Report - DWCRA Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Open Sans', sans-serif; background-color: #f8f9fa; }
        .navbar { background: linear-gradient(135deg, #3F51B5 0%, #5C6BC0 100%); }
        .card { border: none; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/admin_dashboard">
                <i class="fas fa-tachometer-alt me-2"></i>DWCRA Admin
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/admin_dashboard">Dashboard</a>
                <a class="nav-link" href="/admin/users">Users</a>
                <a class="nav-link" href="/admin/groups">Groups</a>
                <a class="nav-link" href="/admin/loans">Loans</a>
                <a class="nav-link active" href="/admin/reports">Reports</a>
                <a class="nav-link" href="/admin/notifications">Notifications</a>
                <a class="nav-link" href="/admin/audit-logs">Audit Logs</a>
                <a class="nav-link" href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0"><i class="fas fa-file-alt me-2"></i>Generate New Report</h4>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label">Report Type *</label>
                                <select class="form-select" name="report_type" required>
                                    <option value="">Select Report Type</option>
                                    <option value="user_list">User List Report</option>
                                    <option value="loan_history">Loan History Report</option>
                                    <option value="payment_history">Payment History Report</option>
                                    <option value="group_performance">Group Performance Report</option>
                                    <option value="identity_verifications">Identity Verification Report</option>
                                </select>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Start Date *</label>
                                    <input type="date" class="form-control" name="start_date" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">End Date *</label>
                                    <input type="date" class="form-control" name="end_date" required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Report Format</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="format" value="excel" checked>
                                    <label class="form-check-label">Excel (.xlsx)</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="format" value="pdf">
                                    <label class="form-check-label">PDF (.pdf)</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="format" value="csv">
                                    <label class="form-check-label">CSV (.csv)</label>
                                </div>
                            </div>
                            
                            <div class="d-flex justify-content-between">
                                <a href="/admin/reports" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left me-1"></i>Back to Reports
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-download me-1"></i>Generate Report
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
